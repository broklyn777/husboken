<figure class="illu"><div class="ill-scroll">
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ett element med luft samlad högst upp. Luftningsnyckeln sitter i luftningsskruven i övre hörnet. Först pyser luft ut, sedan kommer vatten, då stänger man.">
  <!-- element -->
  <rect x="140" y="70" width="380" height="170" rx="8" class="g"/>
  <rect x="146" y="112" width="368" height="122" rx="4" class="wa"/>
  <rect x="146" y="76" width="368" height="36" class="air"/>
  <g class="s2"><path d="M180 82 V230 M220 82 V230 M260 82 V230 M300 82 V230 M340 82 V230 M380 82 V230 M420 82 V230 M460 82 V230"/></g>
  <text x="330" y="99" class="ts" text-anchor="middle">luft samlas här, elementet är kallt upptill</text>
  <!-- rör -->
  <path d="M150 240 V280" class="hol"/>
  <path d="M510 240 V280" class="wal"/>
  <!-- luftningsskruv och nyckel -->
  <rect x="520" y="80" width="14" height="14" class="cr"/>
  <rect x="534" y="82" width="18" height="10" class="cu"/>
  <path d="M552 74 H566 V100 H552 Z" class="cu"/>
  <path d="M584 66 Q600 74 596 92" class="arr"/><path d="M590 88 L596 94 L601 87" class="arr"/>
  <text x="608" y="70" class="tb">kvarts varv moturs</text>
  <!-- kopp -->
  <path d="M520 130 H566 L560 170 H526 Z" class="bg" style="stroke-width:1.4;stroke:var(--fg)"/>
  <text x="543" y="190" class="ts" text-anchor="middle">kopp/trasa</text>
  <!-- steg -->
  <g transform="translate(608 120)">
    <circle cx="10" cy="0" r="10" class="num"/><text x="10" y="4" class="numt" text-anchor="middle">1</text>
    <text x="28" y="5">det pyser: luft</text>
    <circle cx="10" cy="34" r="10" class="num"/><text x="10" y="38" class="numt" text-anchor="middle">2</text>
    <text x="28" y="39">det sprutar vatten</text>
    <circle cx="10" cy="68" r="10" class="num"/><text x="10" y="72" class="numt" text-anchor="middle">3</text>
    <text x="28" y="73" class="tb">stäng direkt</text>
  </g>
  <text x="40" y="164" class="tb">Stäng av</text><text x="40" y="180" class="tb">pumpen först</text>
  <text x="40" y="196" class="ts">vänta 10–15 min</text>
  <text x="160" y="296" class="ts">framledning</text><text x="500" y="296" class="ts" text-anchor="end">retur</text>
</svg></div>
<figcaption>Luften i ett element samlas alltid högst upp. Luftningsskruven sitter i ett av de övre hörnen. Principskiss.</figcaption></figure>
